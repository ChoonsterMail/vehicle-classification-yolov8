name: CI - Code Quality & Automated Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  code-quality:
    name: 🔍 Lint & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install core dependencies & linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Cài đặt các thư viện cơ bản cho kiểm tra cú pháp và logic
          pip install numpy opencv-python-headless pillow PyYAML scikit-learn matplotlib seaborn tqdm

      - name: 🔎 Verify Python syntax (py_compile)
        run: |
          echo "Kiểm tra lỗi cú pháp trong thư mục src/..."
          python -m py_compile src/*.py src/utils/*.py

      - name: 🛡️ Flake8 Critical Error Check
        run: |
          # Dừng build nếu có lỗi cú pháp hoặc biến chưa khai báo (E9, F63, F7, F82)
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Cảnh báo các lỗi format / độ phức tạp mã nguồn (exit-zero)
          flake8 src --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  smoke-tests:
    name: 🧪 Run Module Smoke Demos
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow PyYAML scikit-learn matplotlib seaborn

      - name: 🚀 Test Preprocessing Demo (Letterboxing)
        run: |
          python src/preprocessing.py --demo

      - name: 🚀 Test Mosaic & MixUp Demo
        run: |
          python src/mosaic_mixup.py --demo --no-save

      - name: 🚀 Test Evaluation Metrics Demo
        run: |
          python src/evaluate.py --demo
